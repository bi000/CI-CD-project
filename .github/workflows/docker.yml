# name of the workflows
name: Build And Push Docker Image
# (Event) When should this workflow run.
on:
  push: # on push in mention below branch starts(starts) the workflow
    branches: ["main"] 
  pull_request:
    branches: ["main"] # This is optional 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    # step1: Download your code
      - name: Checkout code
        uses: actions/checkout@v4
    # step2: Login to your Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}
    # setup Docker buildx
    # It is used to build multi-platform images and push them to a registry.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
    # Create  short commit SHA for tagging the image
      - name: Set short SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
    # step3: Build and push your Backend Docker Image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend #(Mention the path of your backend Dockerfile)
          push: true
          tags: bishalmainali/backend:latest
          tags: bishalmainali/backend:main-${{steps.sha.outputs.SHORT_SHA}}
          
    # step4: Build and push front end image
      - name: Build And Push front end image
        uses: docker/build-push-action@v5
        with:
          context: ./my-react-app #(Mention the path of your front end Dockerfile)
          push: true
          tags: bishalmainali/frontend:latest # dockerhub repository name
          tags: bishalmainali/frontend:main-${{steps.sha.outputs.SHORT_SHA}}
          