# Name of the workflow
name: Build And Push Docker Image

# When should this workflow run
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]

jobs:
  # ======================
  # Backend Job
  # ======================
  build-and-push-backend:
    runs-on: ubuntu-latest

    # Run only if backend files changed or it is a release
    if: |
      github.event_name == 'release' ||
      contains(github.event.head_commit.modified, 'backend/') ||
      contains(github.event.head_commit.added, 'backend/')

    steps:
      # Step 1: Download code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Step 3: Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      # Step 4: Run linting
      - name: Run Linting
        working-directory: ./backend
        run: npm run lint --if-present

      # Step 5: Run backend tests
      - name: Run backend tests
        working-directory: ./backend
        run: npm test --if-present

      # Step 6: Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 7: Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 8: Create short commit SHA
      - name: Set short SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Step 9: Build and Push Backend Image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            bishalmainali/backend:latest
            bishalmainali/backend:main-${{ steps.sha.outputs.SHORT_SHA }}
            ${{ github.event_name == 'release' && format('bishalmainali/backend:{0}', github.event.release.tag_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ======================
  # Frontend Job
  # ======================
  build-and-push-frontend:
    runs-on: ubuntu-latest

    # Run only if frontend files changed or it is a release
    if: |
      github.event_name == 'release' ||
      contains(github.event.head_commit.modified, 'my-react-app/') ||
      contains(github.event.head_commit.added, 'my-react-app/')

    steps:
      # Step 1: Download code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: my-react-app/package-lock.json

      # Step 3: Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./my-react-app
        run: npm ci

      # Step 4: Run linting
      - name: Run Linting
        working-directory: ./my-react-app
        run: npm run lint --if-present

      # Step 5: Run frontend tests
      - name: Run frontend tests
        working-directory: ./my-react-app
        run: npm test --if-present

      # Step 6: Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 7: Setup Docker Buildx
      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      # Step 8: Create short commit SHA
      - name: Set short SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Step 9: Build and Push Frontend Image
      - name: Build And Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./my-react-app
          push: true
          tags: |
            bishalmainali/frontend:latest
            bishalmainali/frontend:main-${{ steps.sha.outputs.SHORT_SHA }}
            ${{ github.event_name == 'release' && format('bishalmainali/frontend:{0}', github.event.release.tag_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max