# api version for Deployments
apiVersion: apps/v1
# type of object
kind: Deployment
#metadata = Basic information about the Deployment
metadata:
# name of the deployment
  name: frontend-deployment
  #lable for identifying this deployment
  labels:
    app: frontend
# spacification about this deployment
spec:
  # Number of Pod copies to run
  # replicas recreates the pods if it is crashed.
  replicas: 2
  selector:
    matchLabels:
      app: frontend
    # Pod specification(pod Items like containers, volumes, etc.)
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: bishalmainali/frontend:main-9ae164e
          ports:
        # Nginx in your frontend image serves on port 80
            - containerPort: 80